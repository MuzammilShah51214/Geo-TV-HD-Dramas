<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Modern Video Player - Syed Muzammil Shah</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        :root {
            --pink: #ff416c;
            --pink-glow: #ff416c;
            --dark-bg: #0a0a0a;
            --header-height: 250px;
        }

        body {
            background-color: var(--dark-bg);
            color: #fff;
            overflow-x: hidden;
            user-select: none;
        }

        /* ---------- PLAYER CONTAINER ---------- */
        .player-container {
            position: relative;
            width: 100%;
            height: var(--header-height);
            background: #000;
            border-bottom: 3px solid var(--pink);
            box-shadow: 0 12px 40px rgba(255, 65, 108, 0.25);
            overflow: hidden;
        }

        .player-content {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            background: #0a0a0a;
        }

        /* YouTube iframe wrapper */
        .yt-iframe-wrapper {
            position: absolute;
            top: -55px;
            left: 0;
            width: 100%;
            height: calc(100% + 100px);
            z-index: 1;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        .yt-iframe-wrapper.active {
            opacity: 1;
        }
        #youtube-player {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: auto;
        }

        /* ---------- POSTER / CENTER PLAY ---------- */
        #mainPoster {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.6s ease;
        }
        #mainPoster::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(2px);
        }

        .center-play-btn {
            position: relative;
            z-index: 21;
            width: 85px;
            height: 85px;
            background: var(--pink);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 40px rgba(255, 65, 108, 0.7);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(4px);
        }
        .center-play-btn::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--pink);
            animation: pulse-ring 2.2s linear infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.7); opacity: 0; }
        }
        .center-play-btn:hover {
            transform: scale(1.1);
            background: #ff4b2b;
            box-shadow: 0 0 60px rgba(255, 65, 108, 0.9);
        }
        .center-play-btn svg {
            fill: white;
            width: 38px;
            height: 38px;
            margin-left: 6px;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
        }

        /* ---------- BUFFERING ---------- */
        .buffering-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 3;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(3px);
        }
        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 65, 108, 0.2);
            border-radius: 50%;
            border-top-color: var(--pink);
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---------- BOTTOM UI (controls) ---------- */
        .bottom-ui {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.92));
            padding: 14px 18px 16px;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.35s ease;
            pointer-events: none;
        }
        .player-content.show-ui .bottom-ui {
            opacity: 1;
            pointer-events: auto;
        }

        .p-bar {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            margin-bottom: 10px;
            border-radius: 12px;
            transition: height 0.1s;
        }
        .p-bar:hover {
            height: 7px;
        }
        .p-fill {
            height: 100%;
            background: var(--pink);
            width: 0%;
            border-radius: 12px;
            transition: width 0.08s linear;
            box-shadow: 0 0 12px rgba(255, 65, 108, 0.5);
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .controls-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 40px;
            transition: background 0.2s, transform 0.15s;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(4px);
        }
        .icon-btn:hover {
            background: rgba(255, 65, 108, 0.25);
            transform: scale(1.05);
        }
        .icon-btn:active {
            transform: scale(0.92);
        }

        .v-time {
            font-size: 13px;
            color: #ddd;
            letter-spacing: 0.3px;
            font-weight: 400;
            background: rgba(0,0,0,0.4);
            padding: 4px 10px;
            border-radius: 30px;
            backdrop-filter: blur(2px);
        }

        .fullscreen-btn {
            font-size: 22px;
            background: rgba(255,255,255,0.04);
        }

        /* ---------- INFO SECTION (image left, title centered) ---------- */
        .info-section {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 28px 20px 30px;
            gap: 24px;
            max-width: 900px;
            margin: 0 auto;
            background: linear-gradient(145deg, #0f0f0f, #080808);
            border-radius: 0 0 24px 24px;
            border-bottom: 1px solid rgba(255, 65, 108, 0.15);
        }

        .info-image {
            width: 110px;
            height: 150px;
            border-radius: 16px;
            object-fit: cover;
            border: 2px solid var(--pink);
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            transition: 0.25s;
            flex-shrink: 0;
        }
        .info-image:hover {
            transform: scale(1.02);
            border-color: #ff6b8a;
        }

        .info-text {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1;
            text-align: center;
        }

        .info-text h2 {
            font-size: 1.2rem;
            margin-bottom: 4px;
            font-weight: 600;
            letter-spacing: -0.2px;
            background: linear-gradient(135deg, #fff 60%, #ffa5b9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.3;
        }
        .info-text p {
            color: #aaa;
            font-size: 0.85rem;
            letter-spacing: 0.3px;
        }
        .credit {
            margin-top: 10px;
            color: var(--pink);
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.5px;
            background: rgba(255, 65, 108, 0.08);
            display: inline-block;
            padding: 4px 14px;
            border-radius: 40px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 65, 108, 0.15);
            align-self: center;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (min-width: 768px) {
            :root {
                --header-height: 500px;
            }
            .info-image {
                width: 160px;
                height: 220px;
            }
            .info-text h2 {
                font-size: 1.6rem;
            }
            .controls-left {
                gap: 5px;
            }
            .icon-btn {
                width: 46px;
                height: 46px;
                font-size: 24px;
            }
        }

        @media (max-width: 480px) {
            .center-play-btn {
                width: 70px;
                height: 70px;
            }
            .center-play-btn svg {
                width: 32px;
                height: 32px;
            }
            .info-section {
                padding: 18px 14px;
                gap: 16px;
                flex-wrap: nowrap;
                justify-content: flex-start;
            }
            .info-image {
                width: 80px;
                height: 110px;
            }
            .info-text h2 {
                font-size: 0.95rem;
            }
            .info-text p {
                font-size: 0.7rem;
            }
            .credit {
                font-size: 10px;
                padding: 3px 10px;
            }
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Main Poster (click to start) -->
        <div id="mainPoster" onclick="startVideo()">
            <div class="center-play-btn">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </div>
        </div>

        <div class="player-content" id="playerArea">
            <!-- YouTube iframe -->
            <div class="yt-iframe-wrapper" id="ytWrapper">
                <div id="youtube-player"></div>
            </div>

            <!-- Buffering overlay -->
            <div class="buffering-screen" id="bufferingScreen">
                <div class="loader"></div>
            </div>

            <!-- Click to toggle UI (invisible overlay) -->
            <div style="position:absolute; top:0; left:0; width:100%; height:calc(100% - 60px); z-index:5;" onclick="toggleUI()"></div>

            <!-- Bottom Controls -->
            <div class="bottom-ui">
                <div class="p-bar" id="progressBar" onclick="seek(event)">
                    <div class="p-fill" id="pFill"></div>
                </div>
                <div class="controls-row">
                    <div class="controls-left">
                        <!-- Play/Pause -->
                        <button class="icon-btn" onclick="event.stopPropagation(); playPause();" id="playIcon">⏸</button>
                        <!-- 10s backward -->
                        <button class="icon-btn" onclick="event.stopPropagation(); skip(-10);" title="10s назад">⏪</button>
                        <!-- 10s forward -->
                        <button class="icon-btn" onclick="event.stopPropagation(); skip(10);" title="10s вперед">⏩</button>
                        <span class="v-time"><span id="currTime">0:00</span> / <span id="totalTime">0:00</span></span>
                    </div>
                    <button class="icon-btn fullscreen-btn" onclick="event.stopPropagation(); toggleFullscreen();">⛶</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Info Section – image left, title centered -->
    <div class="info-section">
        <img id="sidePoster" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ3zDOFNoelA2NauPTi6XyMnkn0T6dsCACZkX-CozK1BoDjqt_AulKj6NWI&s=10" alt="Poster" class="info-image">
        <div class="info-text">
            <h2 id="videoTitle"></h2>
            <p id="videoSubtitle">GEO TV MOVIE</p>
            <div class="credit">🩷 ~ 𝑺𝒚𝒆𝒅 𝑴𝒖𝒛𝒂𝒎𝒎𝒊𝒍 𝑺𝒉𝒂𝒉 ~ 🩷</div>
        </div>
    </div>

    <script>
        // ===========================================================
        //  🔹 YOUTUBE VIDEO ID (change here)
        //  🔹 MANUAL POSTER: change src in <img id="sidePoster"> above
        // ===========================================================
        const VIDEO_ID = 'irZPTn1wuAU';   // <-- your video ID

        // Auto-set main poster background from YT 
        document.getElementById('mainPoster').style.backgroundImage = `url('https://i.ytimg.com/vi/${VIDEO_ID}/maxresdefault.jpg')`;

        // We'll fetch video title automatically via OEmbed
        async function fetchVideoTitle(videoId) {
            try {
                const response = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`);
                const data = await response.json();
                if (data && data.title) {
                    document.getElementById('videoTitle').textContent = data.title;
                    // also set subtitle to channel name if available
                    if (data.author_name) {
                        document.getElementById('videoSubtitle').textContent = data.author_name + ' • Official';
                    }
                }
            } catch (error) {
                console.warn('Could not fetch title, using default.');
                // keep default "WAJOOD" 
            }
        }

        // call it
        fetchVideoTitle(VIDEO_ID);

        let player, hideTimeout;

        // Load YouTube IFrame API
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                videoId: VIDEO_ID,
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'modestbranding': 1,
                    'playsinline': 1,
                    'enablejsapi': 1,
                    'rel': 0
                },
                events: {
                    'onStateChange': onStateChange
                }
            });
            setInterval(updateProgress, 300);
        }

        // ---------- Core functions ----------
        function startVideo() {
            const poster = document.getElementById('mainPoster');
            poster.style.opacity = '0';
            setTimeout(() => { poster.style.display = 'none'; }, 600);
            document.getElementById('bufferingScreen').style.display = 'flex';
            player.playVideo();
            showUIWithTimeout();
        }

        function onStateChange(event) {
            const buff = document.getElementById('bufferingScreen');
            const yt = document.getElementById('ytWrapper');
            const btn = document.getElementById('playIcon');

            if (event.data === YT.PlayerState.PLAYING) {
                buff.style.display = 'none';
                yt.classList.add('active');
                btn.innerText = '⏸';
            }
            if (event.data === YT.PlayerState.BUFFERING) {
                buff.style.display = 'flex';
            }
            if (event.data === YT.PlayerState.PAUSED) {
                btn.innerText = '▶';
            }
            if (event.data === YT.PlayerState.ENDED) {
                btn.innerText = '▶';
            }
        }

        function updateProgress() {
            if (player && player.getCurrentTime) {
                const curr = player.getCurrentTime() || 0;
                const dur = player.getDuration() || 0;
                if (dur > 0) {
                    document.getElementById('pFill').style.width = (curr / dur * 100) + '%';
                    document.getElementById('currTime').innerText = format(curr);
                    document.getElementById('totalTime').innerText = format(dur);
                }
            }
        }

        function format(s) {
            if (isNaN(s)) return '0:00';
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return m + ':' + (sec < 10 ? '0' : '') + sec;
        }

        // ---------- Controls ----------
        function toggleUI() {
            const el = document.getElementById('playerArea');
            el.classList.toggle('show-ui');
            if (el.classList.contains('show-ui')) showUIWithTimeout();
        }

        function showUIWithTimeout() {
            const el = document.getElementById('playerArea');
            el.classList.add('show-ui');
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(() => el.classList.remove('show-ui'), 4000);
        }

        function playPause() {
            if (!player) return;
            if (player.getPlayerState() === YT.PlayerState.PLAYING) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        }

        // skip seconds (forward/backward)
        function skip(seconds) {
            if (!player) return;
            const current = player.getCurrentTime() || 0;
            const duration = player.getDuration() || 0;
            let newTime = current + seconds;
            if (newTime < 0) newTime = 0;
            if (newTime > duration) newTime = duration;
            player.seekTo(newTime, true);
            showUIWithTimeout();
        }

        function seek(e) {
            const rect = document.getElementById('progressBar').getBoundingClientRect();
            const pct = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
            if (player && player.getDuration) {
                const dur = player.getDuration();
                if (dur > 0) {
                    player.seekTo(pct * dur, true);
                }
            }
            showUIWithTimeout();
        }

        function toggleFullscreen() {
            const el = document.getElementById('playerArea');
            if (!document.fullscreenElement) {
                el.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        // ---------- extra: prevent context menu on player ----------
        document.querySelector('.player-container').addEventListener('contextmenu', e => e.preventDefault());

        // ---------- if the user clicks on progress bar, stop propagation ----------
        document.getElementById('progressBar').addEventListener('click', (e) => {
            e.stopPropagation();
        });

        // ---------- make icon buttons stop propagation ----------
        document.querySelectorAll('.icon-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
            });
        });

        console.log('✅ Modern Video Player — Syed Muzammil Shah');
        console.log('ℹ️  Manual poster: edit src in <img id="sidePoster">');
    </script>
</body>
</html>
