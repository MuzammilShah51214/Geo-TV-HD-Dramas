<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MAN MAST MALANG · Premium Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: #0b0b0f;
      color: #fff;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* ---------- GLOBAL NEON VARIABLES ---------- */
    :root {
      --neon-pink: #ff2d75;
      --neon-blue: #00e5ff;
      --neon-purple: #b026ff;
      --neon-glow: 0 0 20px rgba(255, 45, 117, 0.6);
      --header-h: 220px;
    }

    /* ---------- ADVANCED LOADING OVERLAY (full page) ---------- */
    #globalLoader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #0b0b0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s cubic-bezier(0.23, 1, 0.32, 1), visibility 0.8s;
      backdrop-filter: blur(2px);
      pointer-events: none;
    }

    #globalLoader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* main loader ring – ultra modern */
    .loader-ring {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loader-ring svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .loader-ring .bg-circle {
      fill: none;
      stroke: #1f1f2a;
      stroke-width: 6;
    }

    .loader-ring .progress-circle {
      fill: none;
      stroke: url(#neonGradient);
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 283;
      stroke-dashoffset: 283;
      animation: loadSpin 1.8s ease-in-out infinite, loadPulse 1.8s ease-in-out infinite;
      filter: drop-shadow(0 0 12px var(--neon-pink));
    }

    @keyframes loadSpin {
      0% { stroke-dashoffset: 283; }
      50% { stroke-dashoffset: 70; }
      100% { stroke-dashoffset: 283; }
    }

    @keyframes loadPulse {
      0%, 100% { filter: drop-shadow(0 0 6px var(--neon-pink)); }
      50% { filter: drop-shadow(0 0 25px var(--neon-blue)); }
    }

    .loader-text {
      position: absolute;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(135deg, var(--neon-pink), var(--neon-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: textFlicker 2s infinite alternate;
    }

    @keyframes textFlicker {
      0% { opacity: 0.7; letter-spacing: 3px; }
      100% { opacity: 1; letter-spacing: 6px; }
    }

    .loader-sub {
      margin-top: 28px;
      font-size: 0.75rem;
      color: #8888aa;
      letter-spacing: 4px;
      font-weight: 300;
      border: 1px solid rgba(255, 45, 117, 0.2);
      padding: 6px 18px;
      border-radius: 40px;
      backdrop-filter: blur(4px);
      background: rgba(255, 255, 255, 0.02);
    }

    /* ---------- HERO (FIXED) ---------- */
    .hero-poster {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: var(--header-h);
      z-index: 100;
      background: #000;
      border-bottom: 2px solid var(--neon-pink);
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(255, 45, 117, 0.2);
    }

    .hero-poster img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center 20%;
      opacity: 0.45;
      transition: opacity 0.6s;
    }

    .poster-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.3) 70%, transparent 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 22px;
      z-index: 2;
    }

    .title-badge {
      font-size: 0.75rem;
      font-weight: 700;
      color: #fff;
      padding: 8px 28px;
      border: 2px solid var(--neon-pink);
      border-radius: 60px;
      text-transform: uppercase;
      letter-spacing: 3px;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(4px);
      box-shadow: 0 0 20px var(--neon-pink), inset 0 0 8px var(--neon-pink);
      animation: glowPulse 1.8s ease-in-out infinite alternate;
      text-shadow: 0 0 12px var(--neon-pink);
    }

    @keyframes glowPulse {
      0% { box-shadow: 0 0 8px var(--neon-pink), inset 0 0 4px var(--neon-pink); transform: scale(1); }
      100% { box-shadow: 0 0 30px var(--neon-pink), 0 0 60px #ff2d7566, inset 0 0 12px var(--neon-pink); transform: scale(1.02); }
    }

    /* ---------- PLAYER BOX (fixed overlay) ---------- */
    .player-box {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: var(--header-h);
      z-index: 2000;
      background: #000;
    }

    .player-content {
      width: 100%; height: 100%;
      position: relative;
      overflow: hidden;
      background: #0a0a0e;
    }

    /* center skip controls */
    .center-controls {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      gap: 70px;
      z-index: 160;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .player-content.show-ui .center-controls {
      opacity: 1;
      pointer-events: auto;
    }

    .skip-btn {
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      border: 1.5px solid var(--neon-blue);
      color: #fff;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      box-shadow: 0 0 18px rgba(0, 229, 255, 0.3);
      transition: 0.2s;
    }

    .skip-btn:hover {
      transform: scale(1.1);
      background: rgba(0, 229, 255, 0.2);
      border-color: #fff;
    }

    .skip-btn span { font-size: 20px; line-height: 1; }

    /* youtube iframe wrapper */
    .yt-iframe-wrapper {
      position: absolute;
      top: -55px; left: 0;
      width: 100%; height: calc(100% + 100px);
      z-index: 1;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .yt-iframe-wrapper.active { opacity: 1; }
    #youtube-player { width: 100%; height: 100%; border: none; pointer-events: auto; }

    /* bottom UI */
    .bottom-ui {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.9));
      padding: 10px 16px 12px;
      z-index: 150;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .player-content.show-ui .bottom-ui { opacity: 1; }

    .p-bar {
      width: 100%; height: 5px;
      background: rgba(255,255,255,0.15);
      cursor: pointer;
      border-radius: 12px;
      margin-bottom: 8px;
      position: relative;
    }
    .p-fill {
      height: 100%;
      background: var(--neon-pink);
      width: 0%;
      border-radius: 12px;
      box-shadow: 0 0 16px var(--neon-pink);
    }

    .close-player-btn {
      position: absolute;
      top: 12px; right: 12px;
      width: 34px; height: 34px;
      border-radius: 50%;
      background: rgba(0,0,0,0.7);
      border: 1.5px solid var(--neon-pink);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      z-index: 200;
      opacity: 0;
      transition: 0.25s;
      backdrop-filter: blur(4px);
    }
    .player-content.show-ui .close-player-btn { opacity: 1; }

    /* spinner animation for buffering */
    @keyframes spinNeon {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* ---------- EPISODE GRID ---------- */
    .container {
      padding: 15px 18px;
      max-width: 1200px;
      margin: calc(var(--header-h) + 28px) auto 0 auto;
    }

    .section-title {
      font-size: 1.2rem;
      font-weight: 600;
      border-left: 5px solid var(--neon-pink);
      padding-left: 14px;
      text-align: left;
      margin: 10px 0 20px 0;
      letter-spacing: 1px;
      color: #f0f0ff;
    }

    .episode-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .ep-card {
      background: #13131b;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #2a2a38;
      position: relative;
      padding: 2px;
      cursor: pointer;
      transition: 0.2s;
    }

    .ep-card.active {
      border: none;
      background: linear-gradient(135deg, var(--neon-pink), var(--neon-blue), var(--neon-purple));
      background-size: 300% 300%;
      animation: borderFlow 3s ease infinite;
    }

    @keyframes borderFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .ep-inner {
      background: #111118;
      border-radius: 12px;
      overflow: hidden;
      height: 100%;
    }

    .ep-upper img {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      display: block;
    }

    .ep-lower {
      padding: 10px 8px;
      font-size: 0.7rem;
      font-weight: 600;
      color: #cfd0e6;
      text-align: left;
      line-height: 1.3;
      letter-spacing: 0.2px;
    }

    /* pagination */
    .pagination-container {
      margin: 30px 0 18px;
      width: 100%;
    }
    .pagination {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 6px 0;
    }
    .page-btn {
      background: #1a1a26;
      color: #ddd;
      border: 1px solid var(--neon-pink);
      padding: 6px 14px;
      border-radius: 40px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: 0.2s;
    }
    .page-btn.active {
      background: var(--neon-pink);
      color: #fff;
      box-shadow: 0 0 20px var(--neon-pink);
      border-color: var(--neon-pink);
    }
    .page-btn:hover {
      background: rgba(255, 45, 117, 0.3);
      transform: translateY(-2px);
    }
    .pagination-info {
      color: #8888bb;
      font-size: 0.75rem;
      margin: 8px 0 4px;
      text-align: center;
      letter-spacing: 0.5px;
    }
    .pagination-nav {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 12px;
    }
    .nav-btn {
      background: #1e1e2c;
      color: #fff;
      border: 1px solid var(--neon-blue);
      padding: 8px 22px;
      border-radius: 40px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: 0.2s;
    }
    .nav-btn:hover:not(:disabled) {
      background: rgba(0, 229, 255, 0.15);
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
    }
    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      border-color: #444;
    }

    /* responsive */
    @media (min-width: 600px) {
      .episode-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (min-width: 900px) {
      :root { --header-h: 440px; }
      .episode-grid { grid-template-columns: repeat(4, 1fr); }
      .title-badge { font-size: 1.6rem; padding: 12px 48px; }
      .skip-btn { width: 68px; height: 68px; font-size: 12px; }
    }
    @media (max-width: 480px) {
      .center-controls { gap: 30px; }
      .skip-btn { width: 44px; height: 44px; }
    }

    /* misc */
    .loading, .error-message { text-align: center; padding: 30px 10px; color: #bbb; }
    .error-message { color: var(--neon-pink); }
    .retry-btn {
      background: var(--neon-pink);
      color: #fff;
      border: none;
      padding: 10px 26px;
      border-radius: 40px;
      font-weight: 600;
      margin-top: 14px;
      cursor: pointer;
    }
    .footer-credit {
      margin-top: 40px;
      color: #444466;
      font-size: 0.7rem;
      letter-spacing: 2px;
      border-top: 1px solid #1f1f2e;
      padding-top: 20px;
    }
  </style>
</head>
<body>

  <!-- ====== GLOBAL LOADER (full page) ====== -->
  <div id="globalLoader">
    <div class="loader-ring">
      <svg viewBox="0 0 100 100">
        <defs>
          <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff2d75" />
            <stop offset="50%" stop-color="#00e5ff" />
            <stop offset="100%" stop-color="#b026ff" />
          </linearGradient>
        </defs>
        <circle class="bg-circle" cx="50" cy="50" r="45" />
        <circle class="progress-circle" cx="50" cy="50" r="45" />
      </svg>
      <div class="loader-text">Loading</div>
    </div>
    <div class="loader-sub" id="loaderSub">✦ Loading Playlist... ✦</div>
  </div>

  <!-- ====== HERO ====== -->
  <div class="hero-poster" id="heroPoster">
    <img id="posterImage" src="" alt="series poster">
    <div class="poster-overlay">
      <div class="title-badge" id="seriesTitle">🎬 Loading...</div>
    </div>
  </div>

  <!-- ====== PLAYER BOX ====== -->
  <div class="player-box" id="playerBox">
    <div class="player-content" id="playerArea">

      <!-- buffering (neon) - fixed spinner -->
      <div id="bufferingScreen" style="position:absolute;inset:0;background:rgba(0,0,0,0.9);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;backdrop-filter:blur(3px);">
        <div style="width:60px;height:60px;border:4px solid transparent;border-top:4px solid var(--neon-pink);border-bottom:4px solid var(--neon-blue);border-radius:50%;animation:spinNeon 0.9s linear infinite;"></div>
        <div style="color:#bbb;margin-top:20px;font-size:13px;letter-spacing:4px;font-weight:300;">LOADING EPISODE</div>
        <div style="color:#555;margin-top:8px;font-size:10px;letter-spacing:2px;">⏳ PLEASE WAIT</div>
      </div>

      <div class="center-controls">
        <button class="skip-btn" onclick="skip(-10); event.stopPropagation();"><span>↺</span>10s</button>
        <button class="skip-btn" onclick="skip(10); event.stopPropagation();"><span>↻</span>10s</button>
      </div>

      <div class="yt-iframe-wrapper" id="ytWrapper">
        <div id="youtube-player"></div>
      </div>

      <button class="close-player-btn" onclick="closePlayer(event)">✕</button>

      <!-- Touch layer to capture taps (above iframe but below controls) -->
      <div id="touchLayer" style="position:absolute;inset:0;z-index:10;cursor:pointer;"></div>

      <div class="bottom-ui" onclick="event.stopPropagation()">
        <div class="p-bar" onclick="seek(event)"><div class="p-fill" id="pFill"></div></div>
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;">
          <div style="display:flex;gap:12px;align-items:center;">
            <button style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer;" onclick="prevEp()">⏮</button>
            <button style="background:none;border:none;color:#fff;font-size:24px;cursor:pointer;" onclick="playPause()" id="playIcon">||</button>
            <button style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer;" onclick="nextEp()">⏭</button>
            <span style="font-size:11px;color:#ccc;"><span id="currTime">0:00</span> / <span id="totalTime">0:00</span></span>
          </div>
          <button style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer;" onclick="toggleFullscreen()">⛶</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ====== MAIN CONTENT ====== -->
  <div class="container">
    <h2 class="section-title">📺 Episodes</h2>
    <div class="episode-grid" id="episodeGrid">
      <div class="loading">Loading episodes...</div>
    </div>
    <div class="pagination-container" id="paginationContainer"></div>
    <div class="footer-credit">⚡ Powered by  𝒮𝓎𝑒𝒹 𝑀𝓊𝓏𝒶𝓂𝓂𝒾𝓁 𝒮𝒽𝒶𝒽 ⚡</div>
  </div>

  <script>
    (function() {
      // -------- CONFIG --------
      const API_KEY = 'AIzaSyACxqw-OnpXUZFv7ym_PTiH4QkdX_KRsN4';
      const PLAYLIST_ID = 'PLdZNFVCDo_1fAo1couOKo4E_uVD7luqpG';
      const DEFAULT_THUMB = "https://images.pexels.com/photos/713149/pexels-photo-713149.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1";

      let videoList = [];
      let currentIdx = 0;
      let player = null;
      let hideTimeout = null;
      let currentPage = 1;
      const PER_PAGE = 20;
      const UI_HIDE_DELAY = 5000;
      let adDetected = false;
      let adSkipAttempts = 0;
      const MAX_AD_SKIP_ATTEMPTS = 10;
      let loaderInterval = null;
      let isUIControlsVisible = false; // Track UI visibility state

      // DOM refs
      const globalLoader = document.getElementById('globalLoader');
      const posterImg = document.getElementById('posterImage');
      const seriesTitle = document.getElementById('seriesTitle');
      const loaderSub = document.getElementById('loaderSub');
      const episodeGrid = document.getElementById('episodeGrid');
      const paginationContainer = document.getElementById('paginationContainer');
      const playerBox = document.getElementById('playerBox');
      const playerArea = document.getElementById('playerArea');
      const ytWrapper = document.getElementById('ytWrapper');
      const bufferingScreen = document.getElementById('bufferingScreen');
      const playIcon = document.getElementById('playIcon');
      const pFill = document.getElementById('pFill');
      const currTime = document.getElementById('currTime');
      const totalTime = document.getElementById('totalTime');
      const touchLayer = document.getElementById('touchLayer');

      // -------- HELPERS --------
      function formatTime(sec) {
        if (!sec || isNaN(sec)) return "0:00";
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return m + ":" + (s < 10 ? "0" : "") + s;
      }

      // -------- TOGGLE UI (tap on touchLayer) - Shows controls, doesn't toggle off--------
      function showUI(e) {
        if (e) e.stopPropagation();
        
        // Only show if not already shown
        if (!isUIControlsVisible) {
          playerArea.classList.add('show-ui');
          isUIControlsVisible = true;
        }
        
        // Always reset timer when interacting
        resetHideTimer();
      }

      function hideUI() {
        if (isUIControlsVisible) {
          playerArea.classList.remove('show-ui');
          isUIControlsVisible = false;
        }
        clearTimeout(hideTimeout);
      }

      // Touch layer click - shows controls (doesn't hide)
      touchLayer.addEventListener('click', showUI);
      
      // For touch devices
      touchLayer.addEventListener('touchstart', function(e) {
        if (!e.target.closest('.bottom-ui') && !e.target.closest('.center-controls') && !e.target.closest('.close-player-btn')) {
          showUI(e);
        }
      }, { passive: true });

      // -------- RESET HIDE TIMER (5 seconds) --------
      function resetHideTimer() {
        clearTimeout(hideTimeout);
        hideTimeout = setTimeout(() => {
          hideUI();
        }, UI_HIDE_DELAY);
      }

      // -------- FETCH ALL VIDEOS (with pagination) --------
      async function fetchAllVideos() {
        let all = [];
        let nextToken = null;
        try {
          do {
            const url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=${PLAYLIST_ID}&key=${API_KEY}` + (nextToken ? `&pageToken=${nextToken}` : '');
            const resp = await fetch(url);
            if (!resp.ok) throw new Error('API error ' + resp.status);
            const data = await resp.json();
            if (data.items) all = all.concat(data.items);
            nextToken = data.nextPageToken || null;
          } while (nextToken);
        } catch (e) {
          console.error('fetch error', e);
          throw e;
        }
        return all;
      }

      // -------- RENDER EPISODES + PAGINATION --------
      async function renderEpisodes(page = 1) {
        try {
          episodeGrid.innerHTML = '<div class="loading">⏳ Loading episodes...</div>';
          paginationContainer.innerHTML = '';

          // fetch playlist details (title + poster)
          const playlistResp = await fetch(`https://www.googleapis.com/youtube/v3/playlists?part=snippet&id=${PLAYLIST_ID}&key=${API_KEY}`);
          const playlistData = await playlistResp.json();
          if (playlistData.items && playlistData.items.length) {
            const snippet = playlistData.items[0].snippet;
            const playlistName = snippet.title || 'MAN MAST MALANG';
            
            // Update title in hero
            seriesTitle.textContent = playlistName;
            
            // UPDATE LOADER SUB TEXT WITH PLAYLIST NAME
            loaderSub.textContent = `✦ ${playlistName} ✦`;
            
            const thumb = snippet.thumbnails;
            posterImg.src = thumb?.maxres?.url || thumb?.standard?.url || thumb?.high?.url || DEFAULT_THUMB;
          }

          // fetch videos
          const raw = await fetchAllVideos();
          
          // First map, then reverse, and sort by title if needed
          videoList = raw
            .map((item) => ({
              id: item.snippet.resourceId.videoId,
              title: item.snippet.title,
              thumbnail: item.snippet.thumbnails?.high?.url || item.snippet.thumbnails?.medium?.url || DEFAULT_THUMB,
            }))
            .reverse();

          // Sort by episode number if titles contain episode numbers
          videoList.sort((a, b) => {
            const numA = parseInt(a.title.match(/\d+/)?.[0] || '999');
            const numB = parseInt(b.title.match(/\d+/)?.[0] || '999');
            return numA - numB;
          });

          if (!videoList.length) {
            episodeGrid.innerHTML = `<div class="error-message">No videos found. <br><button class="retry-btn" onclick="renderEpisodes()">Retry</button></div>`;
            return;
          }

          // update title with count
          seriesTitle.textContent = seriesTitle.textContent + ` (${videoList.length})`;

          // pagination
          const totalPages = Math.ceil(videoList.length / PER_PAGE);
          currentPage = Math.min(page, totalPages);
          const start = (currentPage - 1) * PER_PAGE;
          const end = Math.min(start + PER_PAGE, videoList.length);
          const pageVideos = videoList.slice(start, end);

          // render cards
          episodeGrid.innerHTML = '';
          pageVideos.forEach((v, idx) => {
            const globalIdx = start + idx;
            const epNum = globalIdx + 1;
            const shortTitle = v.title.length > 28 ? v.title.slice(0, 28) + '…' : v.title;
            episodeGrid.innerHTML += `
              <div class="ep-card" id="ep-${globalIdx}" onclick="openPlayer(${globalIdx})">
                <div class="ep-inner">
                  <div class="ep-upper"><img src="${v.thumbnail}" alt="${v.title}" onerror="this.src='${DEFAULT_THUMB}'"></div>
                  <div class="ep-lower">${epNum}. ${shortTitle}</div>
                </div>
              </div>
            `;
          });

          // pagination controls
          if (totalPages > 1) {
            let html = `<div class="pagination-info">Page ${currentPage} / ${totalPages} · ${videoList.length} episodes</div><div class="pagination">`;
            const maxShow = 7;
            let startP = Math.max(1, currentPage - Math.floor(maxShow/2));
            let endP = Math.min(totalPages, startP + maxShow - 1);
            if (endP - startP + 1 < maxShow) startP = Math.max(1, endP - maxShow + 1);
            if (startP > 1) {
              html += `<button class="page-btn" onclick="goToPage(1)">1</button>`;
              if (startP > 2) html += `<span style="color:#777;align-self:center;">…</span>`;
            }
            for (let i = startP; i <= endP; i++) {
              html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goToPage(${i})">${i}</button>`;
            }
            if (endP < totalPages) {
              if (endP < totalPages - 1) html += `<span style="color:#777;align-self:center;">…</span>`;
              html += `<button class="page-btn" onclick="goToPage(${totalPages})">${totalPages}</button>`;
            }
            html += `</div><div class="pagination-nav">
              <button class="nav-btn" onclick="goToPage(${currentPage-1})" ${currentPage===1?'disabled':''}>← Previous</button>
              <button class="nav-btn" onclick="goToPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>Next →</button>
            </div>`;
            paginationContainer.innerHTML = html;
          } else {
            paginationContainer.innerHTML = '';
          }

          // ---- HIDE GLOBAL LOADER (page fully loaded) ----
          globalLoader.classList.add('hidden');

        } catch (err) {
          console.error(err);
          episodeGrid.innerHTML = `<div class="error-message">⚠️ ${err.message}<br><button class="retry-btn" onclick="renderEpisodes()">Retry</button></div>`;
          globalLoader.classList.add('hidden');
        }
      }

      // -------- PAGE NAVIGATION --------
      window.goToPage = function(page) {
        const total = Math.ceil(videoList.length / PER_PAGE);
        if (page < 1 || page > total) return;
        renderEpisodes(page);
        document.querySelector('.container').scrollIntoView({ behavior: 'smooth' });
      };

      // -------- AD BLOCKING FUNCTION --------
      function skipAdIfPresent() {
        if (!player) return;
        
        try {
          const state = player.getPlayerState();
          
          // Check if ad is playing (state 5 = video cued, but ads show as state 1 with different timing)
          // YouTube ads typically have a different duration
          if (state === YT.PlayerState.PLAYING) {
            const duration = player.getDuration();
            const currentTime = player.getCurrentTime();
            
            // If video is less than 30 seconds and not the main content (indicates ad)
            if (duration < 30 && duration > 0) {
              console.log('Ad detected, skipping...');
              adDetected = true;
              adSkipAttempts++;
              
              // Try to skip by seeking to end of ad
              if (duration > 0) {
                player.seekTo(duration, true);
              }
              
              // If still playing, try to pause and play again
              setTimeout(() => {
                if (player.getPlayerState() === YT.PlayerState.PLAYING) {
                  player.pauseVideo();
                  setTimeout(() => {
                    player.playVideo();
                  }, 100);
                }
              }, 100);
            } else {
              // Main content playing, reset ad detection
              adDetected = false;
              adSkipAttempts = 0;
            }
          }
          
          // If ad skip button appears (YouTube might show it as a cue)
          if (state === YT.PlayerState.CUED) {
            setTimeout(() => {
              if (player && player.playVideo) {
                player.playVideo();
              }
            }, 500);
          }
          
        } catch (e) {
          console.log('Ad skip attempt failed:', e);
        }
      }

      // -------- PLAYER CONTROLS --------
      window.openPlayer = function(idx) {
        if (!videoList[idx]) return;
        document.querySelectorAll('.ep-card').forEach(el => el.classList.remove('active'));
        const card = document.getElementById('ep-' + idx);
        if (card) card.classList.add('active');

        currentIdx = idx;
        playerBox.style.display = 'block';
        
        // Reset UI visibility state
        isUIControlsVisible = false;
        hideUI();
        
        // 🔥 SHOW LOADER IMMEDIATELY
        bufferingScreen.style.display = 'flex';
        bufferingScreen.innerHTML = `
          <div style="width:60px;height:60px;border:4px solid transparent;border-top:4px solid var(--neon-pink);border-bottom:4px solid var(--neon-blue);border-radius:50%;animation:spinNeon 0.9s linear infinite;"></div>
          <div style="color:#bbb;margin-top:20px;font-size:13px;letter-spacing:4px;font-weight:300;">LOADING EPISODE</div>
          <div style="color:#555;margin-top:8px;font-size:10px;letter-spacing:2px;">⏳ PLEASE WAIT</div>
        `;
        
        ytWrapper.classList.remove('active');
        
        // Reset ad detection
        adDetected = false;
        adSkipAttempts = 0;

        if (player && player.loadVideoById) {
          player.loadVideoById(videoList[idx].id);
          // Try to skip ads after loading
          setTimeout(() => skipAdIfPresent(), 1000);
          setTimeout(() => skipAdIfPresent(), 3000);
          setTimeout(() => skipAdIfPresent(), 5000);
        } else {
          window._pendingVideoId = videoList[idx].id;
        }
        
        // Show controls when opening
        showUI();
      };

      window.closePlayer = function(e) {
        if (e) e.stopPropagation();
        playerBox.style.display = 'none';
        if (player && player.stopVideo) player.stopVideo();
        ytWrapper.classList.remove('active');
        bufferingScreen.style.display = 'none';
        hideUI();
        clearTimeout(hideTimeout);
        adDetected = false;
        adSkipAttempts = 0;
        clearInterval(loaderInterval);
        isUIControlsVisible = false;
      };

      window.playPause = function() {
        if (!player) return;
        if (player.getPlayerState() === YT.PlayerState.PLAYING) {
          player.pauseVideo();
        } else {
          player.playVideo();
          // Check for ads after playing
          setTimeout(() => skipAdIfPresent(), 500);
          setTimeout(() => skipAdIfPresent(), 1500);
        }
        resetHideTimer();
      };

      window.skip = function(sec) {
        if (player && player.getCurrentTime) {
          player.seekTo(player.getCurrentTime() + sec, true);
          resetHideTimer();
        }
      };

      window.seek = function(e) {
        if (!player || !player.getDuration) return;
        const rect = e.currentTarget.getBoundingClientRect();
        const pct = (e.clientX - rect.left) / rect.width;
        const duration = player.getDuration();
        // Don't allow seeking in ads
        if (duration > 30) {
          player.seekTo(pct * duration, true);
        }
        resetHideTimer();
      };

      window.nextEp = function() {
        if (currentIdx < videoList.length - 1) openPlayer(currentIdx + 1);
      };
      window.prevEp = function() {
        if (currentIdx > 0) openPlayer(currentIdx - 1);
      };

      window.toggleFullscreen = function() {
        const el = playerArea;
        if (!document.fullscreenElement) {
          el.requestFullscreen?.().catch(() => {});
        } else {
          document.exitFullscreen?.();
        }
      };

      // -------- RESET HIDE TIMER (5 seconds) --------
      function resetHideTimer() {
        clearTimeout(hideTimeout);
        hideTimeout = setTimeout(() => {
          hideUI();
        }, UI_HIDE_DELAY);
      }

      // -------- YOUTUBE IFrame API --------
      window.onYouTubeIframeAPIReady = function() {
        player = new YT.Player('youtube-player', {
          playerVars: { 
            autoplay: 1, 
            controls: 0, 
            modestbranding: 1, 
            rel: 0, 
            playsinline: 1,
            origin: window.location.origin,
            enablejsapi: 1,
            fs: 0,
            iv_load_policy: 3
          },
          events: {
            onReady: function() {
              if (window._pendingVideoId) {
                player.loadVideoById(window._pendingVideoId);
                window._pendingVideoId = null;
              }
              // Try to skip ads initially
              setTimeout(() => skipAdIfPresent(), 2000);
              setTimeout(() => skipAdIfPresent(), 4000);
            },
            onStateChange: function(ev) {
              const state = ev.data;
              
              // 🔥 HIDE LOADER WHEN VIDEO STARTS PLAYING
              if (state === YT.PlayerState.PLAYING) {
                bufferingScreen.style.display = 'none';
                ytWrapper.classList.add('active');
                playIcon.innerText = '||';
                // Check if it's an ad
                setTimeout(() => skipAdIfPresent(), 100);
              } 
              // 🔥 SHOW LOADER DURING BUFFERING
              else if (state === YT.PlayerState.BUFFERING) {
                bufferingScreen.style.display = 'flex';
                bufferingScreen.innerHTML = `
                  <div style="width:60px;height:60px;border:4px solid transparent;border-top:4px solid var(--neon-pink);border-bottom:4px solid var(--neon-blue);border-radius:50%;animation:spinNeon 0.9s linear infinite;"></div>
                  <div style="color:#bbb;margin-top:20px;font-size:13px;letter-spacing:4px;font-weight:300;">BUFFERING</div>
                  <div style="color:#555;margin-top:8px;font-size:10px;letter-spacing:2px;">⏳ LOADING CONTENT</div>
                `;
              } 
              else if (state === YT.PlayerState.PAUSED) {
                playIcon.innerText = '▶';
              } 
              else if (state === YT.PlayerState.ENDED) {
                if (currentIdx < videoList.length - 1) {
                  setTimeout(() => openPlayer(currentIdx + 1), 1800);
                }
              }
            },
            onError: function(error) {
              console.log('Player error:', error);
              bufferingScreen.innerHTML = `
                <div style="text-align:center;color:var(--neon-pink);font-size:16px;">⚠️ PLAYBACK ERROR</div>
                <div style="color:#888;margin-top:10px;font-size:12px;">trying next episode...</div>
              `;
              setTimeout(() => {
                if (currentIdx < videoList.length - 1) openPlayer(currentIdx + 1);
              }, 2500);
            }
          }
        });
        // progress updater
        setInterval(() => {
          if (player && player.getCurrentTime && player.getDuration) {
            const c = player.getCurrentTime();
            const d = player.getDuration();
            if (d > 30) { // Only update progress for main content (not ads)
              pFill.style.width = (c/d * 100) + '%';
              currTime.innerText = formatTime(c);
              totalTime.innerText = formatTime(d);
            }
          }
        }, 400);
      };

      // load IFrame API
      (function loadAPI() {
        if (document.getElementById('youtube-iframe-api')) return;
        const tag = document.createElement('script');
        tag.id = 'youtube-iframe-api';
        tag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(tag);
      })();

      // keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (playerBox.style.display === 'none') return;
        if (e.key === ' ' || e.key === 'k') { e.preventDefault(); playPause(); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); skip(-10); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); skip(10); }
        else if (e.key === 'f') { e.preventDefault(); toggleFullscreen(); }
        else if (e.key === 'Escape' && document.fullscreenElement) { document.exitFullscreen(); }
      });

      // -------- BOOT --------
      renderEpisodes();

    })();
  </script>
</body>
</html>
